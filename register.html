<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | Tech Solutions</title>

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#f5f7fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

.container{

    width:100%;
    max-width:430px;

    background:#fff;

    border-radius:18px;

    padding:35px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.08);

}

.logo{

    text-align:center;

    font-size:2rem;

    font-weight:700;

    margin-bottom:8px;

}

.logo span{

    color:#2563eb;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:30px;

}

.inputGroup{

    margin-bottom:18px;

}

.inputGroup label{

    display:block;

    margin-bottom:8px;

    font-size:14px;

    font-weight:600;

}

.inputBox{

    display:flex;

    align-items:center;

    border:1px solid #ddd;

    border-radius:12px;

    overflow:hidden;

}

.inputBox i{

    width:50px;

    text-align:center;

    color:#777;

}

.inputBox input{

    flex:1;

    border:none;

    outline:none;

    padding:14px;

    font-size:15px;

}

.registerBtn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.25s;

}

.registerBtn:hover{

    background:#1d4ed8;

}

.divider{

    display:flex;

    align-items:center;

    margin:25px 0;

}

.divider::before,

.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#ddd;

}

.divider span{

    margin:0 15px;

    color:#777;

    font-size:14px;

}

.google-btn{

    width:100%;

    height:52px;

    border:1px solid #ddd;

    border-radius:12px;

    background:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.25s;

}

.google-btn:hover{

    background:#f8f8f8;

}

.google-btn img{

    width:22px;

}

.bottomText{

    margin-top:25px;

    text-align:center;

    color:#666;

}

.bottomText a{

    color:#2563eb;

    text-decoration:none;

    font-weight:600;

}

.bottomText a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

Tech<span>Solutions</span>

</div>

<p class="subtitle">

Create your account to start shopping.

</p>

<div class="inputGroup">

<label>Full Name</label>

<div class="inputBox">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Enter your full name">

</div>

</div>

<div class="inputGroup">

<label>Email</label>

<div class="inputBox">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

</div>

<div class="inputGroup">

<label>Password</label>

<div class="inputBox">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Create a password">

</div>

</div>

<button
class="registerBtn"
onclick="registerUser()">

Create Account

</button>

<div class="divider">

<span>OR</span>

</div>

<button
id="googleRegisterBtn"
class="google-btn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
alt="Google">

Continue with Google

</button>

<p class="bottomText">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Js/config.js"></script>

<script>



// ==========================================
// EMAIL REGISTER
// ==========================================

async function registerUser() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!name || !email || !password) {

        alert("Please fill in all fields.");

        return;

    }

    try {

        const response = await fetch(

            `${API_BASE}/auth/register`,

            {

                method: "POST",

                headers: {

                    "Content-Type":"application/json"

                },

                body: JSON.stringify({

                    name,
                    email,
                    password

                })

            }

        );

        const result = await response.json();

        if (!response.ok) {

            alert(result.message || "Registration failed.");

            return;

        }

        alert("Registration successful!");

        window.location.href="login.html";

    }

    catch(err){

        console.error(err);

        alert("Unable to connect to server.");

    }

}

// ==========================================
// GOOGLE REGISTER
// ==========================================

async function registerWithGoogle(){

    const { error } =
    await supabase.auth.signInWithOAuth({

        provider:"google",

        options:{

            redirectTo:
            window.location.origin +
            "/index.html"

        }

    });

    if(error){

        alert(error.message);

    }

}

// ==========================================
// BUTTON
// ==========================================

document
.getElementById("googleRegisterBtn")
.addEventListener(

    "click",

    registerWithGoogle

);

// ==========================================
// ENTER KEY SUPPORT
// ==========================================

document
.getElementById("password")
.addEventListener(

    "keypress",

    function(e){

        if(e.key==="Enter"){

            registerUser();

        }

    }

);

</script>

</body>
</html>
