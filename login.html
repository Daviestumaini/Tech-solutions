<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Gadget Finds</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;

}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:25px;

background:
linear-gradient(
135deg,
#eef4ff,
#dbeafe
);

}

.container{

width:100%;
max-width:430px;

background:#fff;

border-radius:24px;

padding:40px;

box-shadow:
0 15px 45px rgba(0,0,0,.08);

}

.logo{

text-align:center;

font-size:2rem;

font-weight:700;

margin-bottom:10px;

}

.logo span{

color:#2563eb;

}

.subtitle{

text-align:center;

color:#777;

margin-bottom:35px;

}

.inputGroup{

margin-bottom:20px;

}

.inputGroup label{

display:block;

margin-bottom:8px;

font-size:.9rem;

font-weight:600;

}

.inputBox{

display:flex;

align-items:center;

border:1px solid #ddd;

border-radius:14px;

overflow:hidden;

transition:.25s;

}

.inputBox:focus-within{

border-color:#2563eb;

box-shadow:
0 0 0 3px rgba(37,99,235,.15);

}

.inputBox i{

width:55px;

text-align:center;

color:#777;

}

.inputBox input{

flex:1;

border:none;

outline:none;

padding:15px;

font-size:15px;

}

.loginBtn{

width:100%;

padding:15px;

border:none;

border-radius:14px;

background:#2563eb;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.loginBtn:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

.divider{

display:flex;

align-items:center;

margin:28px 0;

}

.divider::before,
.divider::after{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.divider span{

margin:0 15px;

font-size:.9rem;

color:#777;

}

.googleBtn{

width:100%;

height:54px;

border:1px solid #ddd;

border-radius:14px;

background:#fff;

display:flex;

justify-content:center;

align-items:center;

gap:12px;

cursor:pointer;

font-size:15px;

font-weight:600;

transition:.25s;

}

.googleBtn:hover{

background:#f8f8f8;

}

.googleBtn img{

width:22px;

}

.bottomText{

margin-top:28px;

text-align:center;

color:#666;

}

.bottomText a{

text-decoration:none;

color:#2563eb;

font-weight:600;

}

.bottomText a:hover{

text-decoration:underline;

}

@media(max-width:500px){

.container{

padding:30px 24px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

Gadget<span>Finds</span>

</div>

<p class="subtitle">

Sign in to continue shopping.

</p>

<div class="inputGroup">

<label>Email Address</label>

<div class="inputBox">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

</div>

<div class="inputGroup">

<label>Password</label>

<div class="inputBox">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password">

</div>

</div>

<button
class="loginBtn"
onclick="login()">

Login

</button>

<div class="divider">

<span>OR</span>

</div>

<button
id="googleLoginBtn"
class="googleBtn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
alt="Google">

Continue with Google

</button>

<p class="bottomText">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Js/config.js"></script>

<script>
    // ==========================================
// CREATE SUPABASE CLIENT
// ==========================================

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

// ==========================================
// EMAIL LOGIN
// ==========================================

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){

        alert("Please enter your email and password.");

        return;

    }

    try{

        const response = await fetch(

            `${API_BASE}/auth/login`,

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    email,
                    password

                })

            }

        );

        const result =
        await response.json();

        if(!response.ok){

            alert(
                result.message ||
                "Login failed."
            );

            return;

        }

        localStorage.setItem(
            "user_id",
            result.user.id
        );

        localStorage.setItem(
            "name",
            result.user.name
        );

        localStorage.setItem(
            "email",
            result.user.email
        );

        localStorage.setItem(
            "role",
            result.user.role
        );

        if(result.session){

            localStorage.setItem(
                "access_token",
                result.session.access_token
            );

            localStorage.setItem(
                "refresh_token",
                result.session.refresh_token
            );

        }

        window.location.href =
        "index.html";

    }

    catch(err){

        console.error(err);

        alert("Unable to connect to the server.");

    }

}

// ==========================================
// GOOGLE LOGIN
// ==========================================

async function googleLogin(){

    try{

        const { error } =
        await supabase.auth.signInWithOAuth({

            provider:"google",

            options:{

                redirectTo:
                window.location.origin +
                "/index.html"

            }

        });

        if(error){

            alert(error.message);

        }

    }

    catch(err){

        console.error(err);

        alert("Google login failed.");

    }

}

document
.getElementById("googleLoginBtn")
.addEventListener(
    "click",
    googleLogin
);

// ==========================================
// HANDLE GOOGLE REDIRECT
// ==========================================

(async()=>{

    const {

        data:{ session }

    } = await supabase.auth.getSession();

    if(!session){

        return;

    }

    const user = session.user;

    try{

        await fetch(

            `${API_BASE}/auth/google-profile`,

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    id:user.id,

                    email:user.email,

                    name:
                    user.user_metadata.full_name ||
                    user.user_metadata.name ||
                    "Google User"

                })

            }

        );

    }

    catch(err){

        console.log(err);

    }

    localStorage.setItem(
        "user_id",
        user.id
    );

    localStorage.setItem(
        "name",
        user.user_metadata.full_name ||
        "Google User"
    );

    localStorage.setItem(
        "email",
        user.email
    );

    localStorage.setItem(
        "access_token",
        session.access_token
    );

    window.location.href =
    "index.html";

})();

// ==========================================
// ENTER KEY SUPPORT
// ==========================================

document
.getElementById("password")
.addEventListener(

    "keypress",

    function(e){

        if(e.key==="Enter"){

            login();

        }

    }

);

</script>

</body>

</html>
