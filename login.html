<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Gadget Finds</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.container{

    width:380px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);

}

h2{

    text-align:center;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

p{

    margin-top:20px;
    text-align:center;

}

a{

    color:#2563eb;
    text-decoration:none;

}
.divider{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:20px 0;
    color:#777;
    font-size:14px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#ddd;
}

.divider span{
    margin:0 15px;
}

.google-btn{
    width:50%;
    height:50px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.2s;
}

.google-btn:hover{
    background:#f8f8f8;
}

.google-btn img{
    width:22px;
}

</style>

</head>

<body>
<div class="divider">
    <span>or</span>
</div>

<button id="googleRegisterBtn" class="google-btn">
    <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
    >
    Continue with Google
</button>
<div class="container">

<h2>Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script>
async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {

       const response = await fetch(
    `${API_BASE}/auth/login`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {

            alert(result.message);

            return;

        }

        localStorage.setItem("user_id", result.user.id);
        localStorage.setItem("name", result.user.name);
        localStorage.setItem("email", result.user.email);
        localStorage.setItem("role", result.user.role);

        if (result.session) {

            localStorage.setItem(
                "access_token",
                result.session.access_token
            );

        }

        alert("Login successful!");

        window.location.href = "index.html";

    }

    catch (err) {

        console.error(err);

        alert("Server Error");

    }

}
async function registerWithGoogle() {

    const { error } = await supabase.auth.signInWithOAuth({

        provider: "google",

        options: {

            redirectTo: "https://tech-solutions.vercel.app"

        }

    });

    if (error) {

        alert(error.message);

    }

}
document
.getElementById("googleRegisterBtn")
.addEventListener("click", registerWithGoogle);
const {
    data: { user }
} = await supabase.auth.getUser();

if (user) {

    await fetch(`${API_BASE}/auth/google-profile`, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            id: user.id,
            email: user.email,
            name: user.user_metadata.full_name

        })

    });

}

</script>
<script src="Js/config.js"></script>
</body>
</html>
