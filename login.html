<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Tech Solutions</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#f5f7fb;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

}

.container{

    width:100%;

    max-width:420px;

    background:#fff;

    border-radius:18px;

    padding:35px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.08);

}

.logo{

    text-align:center;

    font-size:2rem;

    font-weight:700;

    margin-bottom:8px;

}

.logo span{

    color:#2563eb;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:30px;

}

.inputGroup{

    margin-bottom:18px;

}

.inputGroup label{

    display:block;

    margin-bottom:8px;

    font-size:14px;

    font-weight:600;

}

.inputBox{

    display:flex;

    align-items:center;

    border:1px solid #ddd;

    border-radius:12px;

    overflow:hidden;

}

.inputBox i{

    width:50px;

    text-align:center;

    color:#777;

}

.inputBox input{

    flex:1;

    border:none;

    outline:none;

    padding:14px;

    font-size:15px;

}

.loginBtn{

    width:100%;

    border:none;

    background:#2563eb;

    color:white;

    padding:15px;

    border-radius:12px;

    font-size:16px;

    cursor:pointer;

    transition:.25s;

}

.loginBtn:hover{

    background:#1d4ed8;

}

.divider{

    display:flex;

    align-items:center;

    margin:25px 0;

}

.divider::before,

.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#ddd;

}

.divider span{

    margin:0 15px;

    color:#777;

    font-size:14px;

}

.google-btn{

    width:100%;

    height:52px;

    border:1px solid #ddd;

    border-radius:12px;

    background:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.25s;

}

.google-btn:hover{

    background:#f7f7f7;

}

.google-btn img{

    width:22px;

}

.bottomText{

    margin-top:25px;

    text-align:center;

    color:#666;

}

.bottomText a{

    color:#2563eb;

    text-decoration:none;

    font-weight:600;

}

.bottomText a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

Gadget<span>Finds</span>

</div>

<p class="subtitle">

Sign in to continue shopping.

</p>

<div class="inputGroup">

<label>Email</label>

<div class="inputBox">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

</div>

<div class="inputGroup">

<label>Password</label>

<div class="inputBox">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password">

</div>

</div>

<button
class="loginBtn"
onclick="login()">

Login

</button>

<div class="divider">

<span>OR</span>

</div>

<button
id="googleLoginBtn"
class="google-btn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
alt="Google">

Continue with Google

</button>

<p class="bottomText">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Js/config.js"></script>

<script>

// ==========================================
// SUPABASE CLIENT
// ==========================================

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

// ==========================================
// EMAIL LOGIN
// ==========================================

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        alert("Please fill in all fields.");

        return;

    }

    try {

        const response = await fetch(

            `${API_BASE}/auth/login`,

            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    email,
                    password

                })

            }

        );

        const result = await response.json();

        if (!response.ok) {

            alert(result.message || "Login failed.");

            return;

        }

        localStorage.setItem(

            "user_id",

            result.user.id

        );

        localStorage.setItem(

            "name",

            result.user.name

        );

        localStorage.setItem(

            "email",

            result.user.email

        );

        localStorage.setItem(

            "role",

            result.user.role

        );

        if (result.session) {

            localStorage.setItem(

                "access_token",

                result.session.access_token

            );

            localStorage.setItem(

                "refresh_token",

                result.session.refresh_token

            );

        }

        window.location.href = "index.html";

    }

    catch (err) {

        console.error(err);

        alert("Server connection failed.");

    }

}

// ==========================================
// GOOGLE LOGIN
// ==========================================

async function loginWithGoogle() {

    const { error } = await supabase.auth.signInWithOAuth({

        provider: "google",

        options: {

            redirectTo:

                window.location.origin +
                "/index.html"

        }

    });

    if (error) {

        alert(error.message);

    }

}

// ==========================================
// BUTTON
// ==========================================

document
.getElementById("googleLoginBtn")
.addEventListener(
    "click",
    loginWithGoogle
);

// ==========================================
// ENTER KEY LOGIN
// ==========================================

document
.getElementById("password")
.addEventListener(

    "keypress",

    function(e){

        if(e.key==="Enter"){

            login();

        }

    }

);

</script>

</body>
</html>
